<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App - Results</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="animations.css">
</head>
<body>
    <header class="header">
        <h2>Quiz App</h2>
    </header>
    <div class="container">
        <h1>Quiz Results</h1>
        <div id="scoreContainer" class="score-container">
            <h2>Your Score:</h2>
            <p id="score" class="score"></p>
        </div>
        <p id="message" class="message"></p>
        <button id="retryQuiz" class="btn pulse">Retry Quiz</button>
    </div>
    <footer class="footer">
        <p>&copy; 2024 Quiz App.Shweta Thakur All Rights Reserved.</p>
    </footer>
    <script src="main.js"></script>
</body>
</html>
