<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App - Welcome</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="animations.css">
</head>
<body>
    <!-- Header Section -->
    <header class="header">
        <div class="header-content">
            <h1>Quiz App</h1>
            <p>Your knowledge challenge awaits!</p>
        </div>

        <!-- Special Section for Login and Signup -->
        <div class="auth-section">
            <button id="loginButton" class="btn">Login</button>
            <button id="signupButton" class="btn">Sign Up</button>
        </div>
    </header>

    <!-- Main Container for Quiz Content -->
    <main class="container">
        <h2>Welcome to the Quiz App</h2>
        <p>Test your knowledge with our exciting quiz!</p>
        <button id="startQuiz" class="btn pulse">Start Quiz</button>
    </main>

    <!-- Footer Section -->
    <footer class="footer">
        <p>&copy; 2024 Quiz App. Shweta Thakur. All rights reserved.</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
